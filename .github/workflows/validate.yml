name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "work/**"
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  smoke-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke automático pós-deploy
        run: |
          for attempt in $(seq 1 18); do
            echo "Tentativa ${attempt}/18: aguardando o rollout do Coolify"
            if node scripts/smoke-prod.mjs https://eromodels.com.br; then
              exit 0
            fi
            sleep 20
          done
          echo "Smoke de produção não estabilizou após 18 tentativas" >&2
          exit 1
